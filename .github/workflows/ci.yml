name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: make install-lint
      - name: Check
        run: make check

  cover-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: cover-check
        run: make cover-check
      - name: Per-function coverage on failure (DEBUG)
        if: failure()
        run: |
          echo "=== per-function coverage (non-100%) ==="
          go tool cover -func=coverage.out | grep -v "100.0%"
          echo "=== copilot package raw cover.out (uncovered blocks) ==="
          grep "internal/source/copilot" coverage.out | awk '$3 == 0' | head -30
