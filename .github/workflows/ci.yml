name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: make install-lint
      - name: Check
        run: make check

  cover-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: cover-check
        run: |
          go test -short -coverprofile=coverage.out ./... 2>&1 | grep -E "source/pi|FAIL" || true
          echo "uncovered statements:"
          awk '$3==0' coverage.out | grep "source/pi" || true
          go run ./tools/covercheck -threshold 100 -exempt "github.com/psacc/omnisess,tools/covercheck" coverage.out
